[package]
name = "veyndo-app-model"
version = "0.11.0"
edition = "2024"
license-file = "../LICENSE"
description = "Pure app model contracts, bounded schema and field validation extracted from Veyndo"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
cron = "0.17"
sha2 = "0.10"
semver = "1"
url = "2"

[features]
ordered-json-compat = ["serde_json/preserve_order"]
