name: Runtime service container
on:
  pull_request:
    paths: ['service/Dockerfile', 'authority/**', '.github/workflows/runtime-service-image.yml']
  push:
    branches: [main]
    paths: ['service/Dockerfile', 'authority/**', '.github/workflows/runtime-service-image.yml']
  schedule:
    - cron: '45 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: veyndo/sdk
          ref: c621cee931a2e04ba204607a7115f0202797973c
          path: .sdk
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: service/Dockerfile
          tags: veyndo-app-runtime:ci
          load: true
          cache-from: type=gha,scope=apps-runtime
          cache-to: type=gha,scope=apps-runtime,mode=max
      - name: Check non-root Rust-only runtime image
        run: |
          test "$(docker inspect --format '{{.Config.User}}' veyndo-app-runtime:ci)" = '10001:10001'
          docker run --rm --entrypoint sh veyndo-app-runtime:ci -c '! command -v python && ! command -v python3 && ! command -v cargo'
      - name: Real container HTTP/MCP/SDK and current identity acceptance
        run: python3 service/tests/http_mcp.py
        env:
          APP_RUNTIME_TEST_IMAGE: veyndo-app-runtime:ci
          APP_RUNTIME_SDK_MODULE: ${{ github.workspace }}/.sdk/src/index.js
