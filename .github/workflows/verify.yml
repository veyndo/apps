name: App persistence
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  storage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: storage_fixture
          POSTGRES_PASSWORD: synthetic-fixture-only
          POSTGRES_DB: app_storage_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_STORAGE_TEST_DATABASE_URL: postgres://storage_fixture:synthetic-fixture-only@127.0.0.1:5432/app_storage_test
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked build artifacts
        run: python3 -c "import subprocess; from pathlib import PurePosixPath; paths=subprocess.check_output(['git','ls-files','-z']).decode().split('\0'); assert not any('target' in PurePosixPath(p).parts for p in paths), 'Tracked Rust build artifacts'"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check && cargo clippy --workspace --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --manifest-path model/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path model/Cargo.toml --tests
      - run: cargo test --locked --manifest-path model/Cargo.toml --features ordered-json-compat --test package_domains
      - run: cargo run --locked --example upgrade_settings
      - run: cargo run --locked --example event_contracts
      - run: cargo run --locked --example object_graph
      - run: cargo run --locked --example surface_routes
      - run: cargo run --locked --example package_contracts
      - run: cargo run --locked --example native_lifecycles
      - run: cargo run --locked --example native_views
      - run: cargo test --locked --test postgres -- --ignored --nocapture
      - run: cargo run --locked --example job_control
      - run: cargo run --locked --example encrypted_settings
      - run: cargo run --locked --example build_versions
      - run: cargo run --locked --example private_drafts
      - run: cargo run --locked --example record_history
      - run: cargo run --locked --example package_state
      - run: cargo run --locked --example schema_upgrade

  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime
      - run: cargo fmt --manifest-path runtime/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path runtime/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path runtime/Cargo.toml
      - run: cargo run --locked --manifest-path runtime/Cargo.toml --example quote -- 25000
      - run: cargo run --locked --manifest-path runtime/Cargo.toml --example business_preflight
      - run: cargo run --locked --manifest-path runtime/Cargo.toml --example package_compile

  service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: veyndo/sdk
          ref: c621cee931a2e04ba204607a7115f0202797973c
          path: .sdk
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: service
      - run: cargo fmt --manifest-path service/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path service/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path service/Cargo.toml
      - run: cargo build --locked --manifest-path service/Cargo.toml
      - run: python3 service/tests/http_mcp.py
        env:
          APP_RUNTIME_SDK_MODULE: ${{ github.workspace }}/.sdk/src/index.js

  data-reader:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: reader_fixture
          POSTGRES_PASSWORD: synthetic-fixture-only
          POSTGRES_DB: reader_fixture
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: veyndo/sdk
          ref: c621cee931a2e04ba204607a7115f0202797973c
          path: .sdk
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            data-service
            authority
      - run: cargo fmt --manifest-path data-service/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path data-service/Cargo.toml --all-targets -- -D warnings
      - run: cargo fmt --manifest-path authority/Cargo.toml --check
      - run: cargo test --locked --manifest-path authority/Cargo.toml --features oauth,vault
      - run: cargo test --locked --lib
      - run: cargo test --locked --manifest-path data-service/Cargo.toml
      - run: cargo build --locked --manifest-path data-service/Cargo.toml
      - run: python3 data-service/tests/acceptance.py
        env:
          APP_DATA_TEST_ADMIN_URL: postgres://reader_fixture:synthetic-fixture-only@127.0.0.1:5432/reader_fixture
          APP_DATA_SDK_MODULE: ${{ github.workspace }}/.sdk/src/index.js
