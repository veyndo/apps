name: App persistence
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  storage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: storage_fixture
          POSTGRES_PASSWORD: synthetic-fixture-only
          POSTGRES_DB: app_storage_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_STORAGE_TEST_DATABASE_URL: postgres://storage_fixture:synthetic-fixture-only@127.0.0.1:5432/app_storage_test
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked build artifacts
        run: python3 -c "import subprocess; from pathlib import PurePosixPath; paths=subprocess.check_output(['git','ls-files','-z']).decode().split('\0'); assert not any('target' in PurePosixPath(p).parts for p in paths), 'Tracked Rust build artifacts'"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check && cargo clippy --workspace --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --manifest-path model/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path model/Cargo.toml --tests
      - run: cargo test --locked --manifest-path model/Cargo.toml --features ordered-json-compat --test package_domains
      - run: cargo run --locked --example upgrade_settings
      - run: cargo run --locked --example event_contracts
      - run: cargo run --locked --example object_graph
      - run: cargo run --locked --example surface_routes
      - run: cargo run --locked --example package_contracts
      - run: cargo run --locked --example native_lifecycles
      - run: cargo run --locked --example native_views
      - run: cargo test --locked --test postgres -- --ignored --nocapture

  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime
      - run: cargo fmt --manifest-path runtime/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path runtime/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path runtime/Cargo.toml
      - run: cargo run --locked --manifest-path runtime/Cargo.toml --example quote -- 25000
      - run: cargo run --locked --manifest-path runtime/Cargo.toml --example business_preflight
      - run: cargo run --locked --manifest-path runtime/Cargo.toml --example package_compile
