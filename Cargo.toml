[package]
name = "veyndo-app-storage"
version = "0.19.0"
edition = "2024"
license-file = "LICENSE"
description = "Scoped PostgreSQL persistence extracted from Veyndo native app records and jobs"

[dependencies]
veyndo-app-model = { path = "model" }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "json"] }

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "json", "runtime-tokio", "tls-rustls"] }
base64 = "0.22"
ring = "0.17"
